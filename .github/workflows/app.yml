name: App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every merge to main publishes the next patch release (v0.2.0 -> v0.2.1),
# unless the merge commit message has [skip release]. Push a tag like v0.3.0
# for a minor or major version. Runs on main and on tags go one at a time,
# so two quick merges get two versions; pull request runs replace older ones.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }} # the release this run publishes; empty for none
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          tag=''
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main && "$MSG" != *"[skip release]"* ]]; then
            # the next patch after the newest vX.Y.Z tag
            last=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: ${tag:-none from this run}"

  app:
    name: Windows app (x64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
          cache: ${{ needs.version.outputs.tag == '' }} # a build that is published never uses a restored cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false # the lockfile pins every package; no restored cache
      - name: Engine and Wintun
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p ui/engine
          ver="${GITHUB_SHA:0:8}"
          if [ -n "$TAG" ]; then ver="$TAG+$ver"; fi
          go build -trimpath -ldflags="-checklinkname=0 -s -w -X main.version=$ver" -o ui/engine/fswin.exe ./cmd/fswin
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll ui/engine/
          cp wintun/LICENSE.txt ui/engine/wintun-LICENSE.txt
      - name: usque (WARP over MASQUE)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          # usque#5: a network that keeps killing QUIC moves to HTTP/2; also
          # v0.0.4: a dead tunnel rebuilt within seconds
          # (--stall-timeout, -r 1s), --connect-timeout, network watch
          USQUE_REPO: https://github.com/paulvers-ui2/usque.git
          USQUE_REF: a515ed69cd4c02a88c0c8d4753e5e540865a7fe0 # usque v0.1.7
        run: |
          git init -q usque-src
          git -C usque-src fetch -q --depth 1 "$USQUE_REPO" "$USQUE_REF"
          git -C usque-src checkout -q FETCH_HEAD
          (cd usque-src && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/ui/engine/usque.exe" .)
          cp usque-src/LICENSE.md ui/engine/usque-LICENSE.md
      - name: Check scripts
        shell: bash
        run: for f in ui/main.js ui/preload.js ui/renderer/*.js; do node --check "$f"; done
      # the app is Electron (ui/): the window and tray; the engine (fswin, Go)
      # and AuroraVPN Service do the work and keep protection up
      - name: Version of the release
        if: needs.version.outputs.tag != ''
        shell: bash
        working-directory: ui
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          v="${TAG#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version: $v"; exit 1; }
          npm pkg set version="$v"
      - name: Build installer and portable exe
        shell: bash
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run dist
      # the packaged app must start: its Electron fuses, the asar, the window,
      # its scripts and IPC (main.js --self-test)
      - name: Start the packaged app
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Join-Path $PWD 'ui/dist/win-unpacked/AuroraVPN.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          Get-Content (Join-Path $env:APPDATA 'AuroraVPN/app.log') -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "the packaged app failed its self-test (exit code $($p.ExitCode))" }
      # Windows' exploit mitigations against memory corruption (ASLR, DEP) on
      # in every exe and dll the app ships (tools/check-mitigations.ps1)
      - name: Exploit mitigations
        shell: pwsh
        run: ./tools/check-mitigations.ps1 -Path (Get-ChildItem ui/dist/win-unpacked -Recurse -Include *.exe,*.dll).FullName
      # one artifact per file: download only the one you need
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auroravpn-setup-windows-x64
          path: ui/dist/*-Setup-*.exe
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auroravpn-portable-windows-x64
          path: ui/dist/*-portable.exe
          compression-level: 0
          if-no-files-found: error

  # The Linux app: the same engine and Electron app as a .deb for Debian 12
  # and 13 and Ubuntu 22.04 and 24.04 (Debian 11 best effort). It is its own
  # job: the Windows release never waits on it or fails with it.
  linux:
    name: Linux app (.deb, x64)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ needs.version.outputs.tag == '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Engine
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0" # static: runs on any glibc, Debian 11 too
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p ui/engine
          ver="${GITHUB_SHA:0:8}"
          if [ -n "$TAG" ]; then ver="$TAG+$ver"; fi
          go build -trimpath -ldflags="-checklinkname=0 -s -w -X main.version=$ver" -o ui/engine/fswin ./cmd/fswin
          ui/engine/fswin -version
      - name: usque (WARP over MASQUE)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          USQUE_REPO: https://github.com/paulvers-ui2/usque.git
          USQUE_REF: a515ed69cd4c02a88c0c8d4753e5e540865a7fe0 # usque v0.1.7
        run: |
          git init -q usque-src
          git -C usque-src fetch -q --depth 1 "$USQUE_REPO" "$USQUE_REF"
          git -C usque-src checkout -q FETCH_HEAD
          (cd usque-src && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/ui/engine/usque" .)
          cp usque-src/LICENSE.md ui/engine/usque-LICENSE.md
      - name: Version of the release
        if: needs.version.outputs.tag != ''
        working-directory: ui
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          v="${TAG#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version: $v"; exit 1; }
          npm pkg set version="$v"
      - name: Build the .deb
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run dist:linux
          deb=$(ls dist/*.deb)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -E 'engine/(fswin|usque)$|auroravpn.service$'
      # installed for real: postinst enables AuroraVPN Service under systemd,
      # the packaged app passes its self-test, and the service answers only
      # the installed app
      - name: Install and start
        run: |
          # each failure says why in an annotation, with the service's journal
          fail() {
            echo "::error::$1 | $(sudo journalctl -u auroravpn --no-pager -n 25 2>&1 | tr '\n' '|' | tail -c 3000)"
            exit 1
          }
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb ./ui/dist/*.deb || fail "apt install"
          systemctl is-enabled auroravpn || fail "auroravpn.service is not enabled"
          for i in $(seq 1 30); do systemctl is-active -q auroravpn && break; sleep 0.5; done
          systemctl is-active -q auroravpn || fail "auroravpn.service is not running: $(systemctl status auroravpn --no-pager 2>&1 | head -12 | tr '\n' '|')"
          test -S /run/auroravpn/auroravpn.sock || fail "no socket: $(ls -la /run/auroravpn 2>&1 | tr '\n' '|')"
          reply=$(python3 -c 'import socket;s=socket.socket(socket.AF_UNIX);s.connect("/run/auroravpn/auroravpn.sock");s.sendall(b"{\"cmd\":\"ping\"}\n");s.shutdown(socket.SHUT_WR);print(s.makefile().read())' 2>&1)
          echo "$reply"
          echo "$reply" | grep -q 'only /opt/AuroraVPN/auroravpn may use AuroraVPN Service' || fail "the service answered another program: $reply"
          out=$(timeout 120 xvfb-run -a auroravpn --self-test 2>&1) || fail "app self-test: $(echo "$out" | tail -n 15 | tr '\n' '|') app.log: $(tail -n 10 ~/.config/AuroraVPN/app.log 2>&1 | tr '\n' '|')"
          tail -n 20 ~/.config/AuroraVPN/app.log || true
      - name: Remove
        run: |
          sudo apt-get remove -y -q auroravpn
          if systemctl is-active -q auroravpn; then echo "::error::auroravpn.service still runs after remove"; exit 1; fi
          if [ -e /usr/lib/systemd/system/auroravpn.service ]; then echo "::error::the unit is left after remove"; exit 1; fi
      # installs and its engine runs on each supported release
      - name: Install on Debian and Ubuntu
        run: |
          deb=$(ls ui/dist/*.deb)
          for img in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04 debian:11; do
            echo "::group::$img"
            if docker run --rm -v "$PWD/ui/dist:/dist:ro" "$img" sh -c \
                'export DEBIAN_FRONTEND=noninteractive; apt-get update -q >/dev/null && apt-get install -y -q /dist/*.deb >/dev/null && /opt/AuroraVPN/resources/engine/fswin -version && /opt/AuroraVPN/resources/engine/usque --help >/dev/null'; then
              echo "$img: ok"
            elif [ "$img" = debian:11 ]; then
              echo "::warning::debian:11 (best effort): the .deb did not install"
            else
              echo "::error::$img: the .deb did not install"; exit 1
            fi
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auroravpn-deb-linux-x64
          path: ui/dist/*.deb
          compression-level: 0
          if-no-files-found: error

  # Publishes the build as the latest GitHub release: on every merge to main,
  # and for a pushed vX.Y.Z tag. The app's update check reads it.
  release:
    name: GitHub release
    if: needs.version.outputs.tag != ''
    needs: [version, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write # start release-aar.yml for this release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # keep it with the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: auroravpn-*-windows-x64
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      # anyone can check that a download was built here, from this commit:
      # gh attestation verify AuroraVPN-Setup-<version>.exe -R paulvers-ui2/port1897
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # creates the tag on this commit when it is new (a merge to main)
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "AuroraVPN $TAG"
          --generate-notes
          --latest
      # a release made with the workflow token starts no workflows, so the
      # Android library is built for it here; it lands on this same release
      - name: Attach the Android library
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh workflow run release-aar.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"

  # The .deb lands on the same release once it is out. Separate from the
  # release job, so a Linux failure never holds back the Windows release.
  release-linux:
    name: GitHub release (.deb)
    if: needs.version.outputs.tag != '' && needs.release.result == 'success' && needs.linux.result == 'success'
    needs: [version, release, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auroravpn-deb-linux-x64
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
