name: App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every merge to main publishes the next patch release (v0.2.0 -> v0.2.1),
# unless the merge commit message has [skip release]. Push a tag like v0.3.0
# for a minor or major version. Runs on main and on tags go one at a time,
# so two quick merges get two versions; pull request runs replace older ones.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }} # the release this run publishes; empty for none
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          tag=''
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main && "$MSG" != *"[skip release]"* ]]; then
            # the next patch after the newest vX.Y.Z tag
            last=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: ${tag:-none from this run}"

  app:
    name: Windows app (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
          cache: ${{ needs.version.outputs.tag == '' }} # a build that is published never uses a restored cache
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false # the lockfile pins every package; no restored cache
      # the app (desktop/) is Rust on Tauri; one pinned toolchain
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal -c clippy
          rustup default 1.99.0
          rustc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.version.outputs.tag == '' # a build that is published never uses a restored cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/target
          key: cargo-${{ runner.os }}-1.99.0-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.99.0-
      - name: Engine and Wintun
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p ui/engine
          ver="${GITHUB_SHA:0:8}"
          if [ -n "$TAG" ]; then ver="$TAG+$ver"; fi
          go build -trimpath -ldflags="-checklinkname=0 -s -w -X main.version=$ver" -o ui/engine/fswin.exe ./cmd/fswin
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll ui/engine/
          cp wintun/LICENSE.txt ui/engine/wintun-LICENSE.txt
      - name: usque (WARP over MASQUE)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          # v0.0.4, as the Android app: a dead tunnel rebuilt within seconds
          # (--stall-timeout, -r 1s), --connect-timeout, network watch
          USQUE_REPO: https://github.com/paulvers-ui2/usque.git
          USQUE_REF: 45e3979ce04c91839307c602538f635e59b10f39
        run: |
          git init -q usque-src
          git -C usque-src fetch -q --depth 1 "$USQUE_REPO" "$USQUE_REF"
          git -C usque-src checkout -q FETCH_HEAD
          (cd usque-src && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/ui/engine/usque.exe" .)
          cp usque-src/LICENSE.md ui/engine/usque-LICENSE.md
      - name: Check scripts
        shell: bash
        run: for f in ui/main.js ui/preload.js ui/renderer/*.js; do node --check "$f"; done
      # ui/ keeps the Electron app's sources; only its screens (ui/renderer)
      # ship, inside the Tauri app (desktop/): its installer and portable zip
      - name: Version of the release
        if: needs.version.outputs.tag != ''
        shell: bash
        working-directory: desktop
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          v="${TAG#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "not a version: $v"; exit 1; }
          node -e 'const fs = require("fs"), f = "tauri.conf.json", c = JSON.parse(fs.readFileSync(f, "utf8")); c.version = process.argv[1]; fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n")' "$v"
          # the package's own version line, and its entry in Cargo.lock
          sed -i '0,/^version = /s/^version = "[^"]*"/version = "'"$v"'"/' Cargo.toml
          sed -i '/^name = "auroravpn"/{n;s/^version = "[^"]*"/version = "'"$v"'"/}' Cargo.lock
          grep -m1 '"version"' tauri.conf.json
          grep -m1 '^version = ' Cargo.toml
          grep -A1 '^name = "auroravpn"' Cargo.lock
      - name: Test and lint the app
        shell: bash
        working-directory: desktop
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the app and its installer
        shell: bash
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build -- --locked
      # the portable app: AuroraVPN.exe with engine\ beside it, laid out as
      # the installer lays it out (bundle.resources in tauri.conf.json)
      - name: Installer and portable app
        shell: pwsh
        run: |
          $conf = Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json
          $v = $conf.version
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item "desktop/target/release/bundle/nsis/AuroraVPN_${v}_x64-setup.exe" "dist/AuroraVPN-Setup-$v.exe"
          Copy-Item desktop/target/release/AuroraVPN.exe dist/portable/
          foreach ($r in $conf.bundle.resources.PSObject.Properties) {
            $to = Join-Path dist/portable $r.Value
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Copy-Item (Join-Path desktop $r.Name) $to
          }
          Get-ChildItem dist -Recurse -File | Format-Table -AutoSize FullName, Length
      # the app must start: the window, its scripts and IPC (main.rs
      # --self-test), with the engine found beside it, not in ui/engine
      - name: Start the app
        shell: pwsh
        timeout-minutes: 3
        run: |
          $dir = (Resolve-Path dist/portable).Path
          $p = Start-Process -FilePath "$dir\AuroraVPN.exe" -ArgumentList '--self-test' -PassThru -Wait
          $log = @(Get-Content (Join-Path $env:APPDATA 'AuroraVPN/app.log') -ErrorAction SilentlyContinue)
          $log | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "the app failed its self-test (exit code $($p.ExitCode))" }
          if (-not ($log | Select-String -SimpleMatch "$dir\engine")) { throw "the app did not use the engine beside it, $dir\engine" }
      # Windows' exploit mitigations against memory corruption (ASLR, DEP) on
      # in every exe and dll the app ships (tools/check-mitigations.ps1)
      - name: Exploit mitigations
        shell: pwsh
        run: ./tools/check-mitigations.ps1 -Path (Get-ChildItem dist/portable -Recurse -Include *.exe,*.dll).FullName
      - name: Portable zip
        shell: pwsh
        run: |
          $v = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/AuroraVPN-$v-portable.zip"
      # one artifact per file: download only the one you need
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: auroravpn-setup-windows-x64
          path: dist/AuroraVPN-Setup-*.exe
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: auroravpn-portable-windows-x64
          path: dist/AuroraVPN-*-portable.zip
          compression-level: 0
          if-no-files-found: error

  # Publishes the build as the latest GitHub release: on every merge to main,
  # and for a pushed vX.Y.Z tag. The app's update check reads it.
  release:
    name: GitHub release
    if: needs.version.outputs.tag != ''
    needs: [version, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write # start release-aar.yml for this release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # keep it with the repository
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: auroravpn-*-windows-x64
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      # anyone can check that a download was built here, from this commit:
      # gh attestation verify AuroraVPN-Setup-<version>.exe -R paulvers-ui2/port1897
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # creates the tag on this commit when it is new (a merge to main)
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "AuroraVPN $TAG"
          --generate-notes
          --latest
      # a release made with the workflow token starts no workflows, so the
      # Android library is built for it here; it lands on this same release
      - name: Attach the Android library
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh workflow run release-aar.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
