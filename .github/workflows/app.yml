name: App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Windows app (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }} # tag builds are the published release: clean cache
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Engine and Wintun
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          mkdir -p ui/engine
          go build -trimpath -ldflags="-checklinkname=0 -s -w -X main.version=${GITHUB_SHA:0:8}" -o ui/engine/fswin.exe ./cmd/fswin
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll ui/engine/
          cp wintun/LICENSE.txt ui/engine/wintun-LICENSE.txt
      - name: usque (WARP over MASQUE)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          USQUE_REPO: https://github.com/paulvers-ui/usque.git
          USQUE_REF: b6c79c7d3058e484d845f461447c91daa03df24e
        run: |
          git init -q usque-src
          git -C usque-src fetch -q --depth 1 "$USQUE_REPO" "$USQUE_REF"
          git -C usque-src checkout -q FETCH_HEAD
          (cd usque-src && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/ui/engine/usque.exe" .)
          cp usque-src/LICENSE.md ui/engine/usque-LICENSE.md
      - name: Check scripts
        shell: bash
        run: for f in ui/main.js ui/preload.js ui/renderer/*.js; do node --check "$f"; done
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: ui
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build installer and portable exe
        shell: bash
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm run dist
      # one artifact per file: download only the one you need (~120 MB each)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: port1897-setup-windows-x64
          path: ui/dist/*-Setup-*.exe
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: port1897-portable-windows-x64
          path: ui/dist/*-portable.exe
          compression-level: 0

  # Pushing a tag like v0.2.0 publishes the build as a GitHub release.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: port1897-*-windows-x64
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "port1897 $GITHUB_REF_NAME"
          --generate-notes
          --prerelease
