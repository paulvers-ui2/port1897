name: App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Windows app (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine and Wintun
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          mkdir -p ui/engine
          go build -trimpath -ldflags="-checklinkname=0 -s -w -X main.version=${GITHUB_SHA:0:8}" -o ui/engine/fswin.exe ./cmd/fswin
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll ui/engine/
          cp wintun/LICENSE.txt ui/engine/wintun-LICENSE.txt
      - name: Check scripts
        shell: bash
        run: for f in ui/main.js ui/preload.js ui/renderer/app.js ui/renderer/icons.js; do node --check "$f"; done
      - name: Build installer and portable exe
        shell: bash
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: port1897-app-windows-x64
          path: ui/dist/*.exe
