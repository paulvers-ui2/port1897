name: App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every merge to main publishes the next patch release (v0.2.0 -> v0.2.1),
# unless the merge commit message has [skip release]. Push a tag like v0.3.0
# for a minor or major version. Runs on main and on tags go one at a time,
# so two quick merges get two versions; pull request runs replace older ones.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }} # the release this run publishes; empty for none
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          tag=''
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main && "$MSG" != *"[skip release]"* ]]; then
            # the next patch after the newest vX.Y.Z tag
            last=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: ${tag:-none from this run}"

  app:
    name: Windows app (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
          cache: ${{ needs.version.outputs.tag == '' }} # a build that is published never uses a restored cache
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false # the lockfile pins every package; no restored cache
      - name: Engine and Wintun
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p ui/engine
          ver="${GITHUB_SHA:0:8}"
          if [ -n "$TAG" ]; then ver="$TAG+$ver"; fi
          go build -trimpath -ldflags="-checklinkname=0 -s -w -X main.version=$ver" -o ui/engine/fswin.exe ./cmd/fswin
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll ui/engine/
          cp wintun/LICENSE.txt ui/engine/wintun-LICENSE.txt
      - name: usque (WARP over MASQUE)
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          # v0.0.4, as the Android app: a dead tunnel rebuilt within seconds
          # (--stall-timeout, -r 1s), --connect-timeout, network watch
          USQUE_REPO: https://github.com/paulvers-ui2/usque.git
          USQUE_REF: 45e3979ce04c91839307c602538f635e59b10f39
        run: |
          git init -q usque-src
          git -C usque-src fetch -q --depth 1 "$USQUE_REPO" "$USQUE_REF"
          git -C usque-src checkout -q FETCH_HEAD
          (cd usque-src && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/ui/engine/usque.exe" .)
          cp usque-src/LICENSE.md ui/engine/usque-LICENSE.md
      - name: Check scripts
        shell: bash
        run: for f in ui/main.js ui/preload.js ui/renderer/*.js; do node --check "$f"; done
      - name: Version of the release
        if: needs.version.outputs.tag != ''
        shell: bash
        working-directory: ui
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm pkg set version="${TAG#v}"
      - name: Build installer and portable exe
        shell: bash
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run dist
      # the packaged app must start: its Electron fuses, the asar, the window,
      # its scripts and IPC (main.js --self-test)
      - name: Start the packaged app
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = Join-Path $PWD 'ui/dist/win-unpacked/AuroraVPN.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          Get-Content (Join-Path $env:APPDATA 'AuroraVPN/app.log') -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "the packaged app failed its self-test (exit code $($p.ExitCode))" }
      # Windows' exploit mitigations against memory corruption (ASLR, DEP) on
      # in every exe and dll the app ships (tools/check-mitigations.ps1)
      - name: Exploit mitigations
        shell: pwsh
        run: ./tools/check-mitigations.ps1 -Path (Get-ChildItem ui/dist/win-unpacked -Recurse -Include *.exe,*.dll).FullName
      # one artifact per file: download only the one you need (~120 MB each)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: auroravpn-setup-windows-x64
          path: ui/dist/*-Setup-*.exe
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: auroravpn-portable-windows-x64
          path: ui/dist/*-portable.exe
          compression-level: 0

  # A PC with the Tauri app (0.2.28 to 0.2.30) installed gets this installer:
  # it must remove the Tauri app (ui/build/installer.nsh, customInit), keep
  # the user's files and leave the Electron app with its service.
  upgrade:
    name: Upgrade from the Tauri app
    needs: app
    runs-on: windows-latest # admin: both installers are per-machine
    timeout-minutes: 15
    env:
      OLD_URL: https://github.com/paulvers-ui2/port1897/releases/download/v0.2.30/AuroraVPN-Setup-0.2.30.exe
      OLD_SHA256: 51347f11eaebb8a75dd69ae15d4fb059c7b66e0a76a0dc9cb89fd1332fffa5d4
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: auroravpn-setup-windows-x64
          path: new
      - name: Install the Tauri app, then this one over it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tauriKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\AuroraVPN'
          $electronKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\b08e5cfd-4d07-54eb-9603-c0c30dd5023b'
          $fail = @()
          function Check([string]$what, [bool]$ok) {
            Write-Host "$(if ($ok) { 'ok  ' } else { 'FAIL' }) $what"
            if (-not $ok) { $script:fail += $what }
          }
          function Service-Path { (Get-CimInstance Win32_Service -Filter "Name='AuroraVPN'").PathName }

          Invoke-WebRequest -Uri $env:OLD_URL -OutFile old-setup.exe
          if ((Get-FileHash old-setup.exe -Algorithm SHA256).Hash -ne $env:OLD_SHA256) { throw 'AuroraVPN-Setup-0.2.30.exe: wrong SHA-256' }
          $p = Start-Process -FilePath .\old-setup.exe -ArgumentList '/S' -PassThru -Wait
          # Tauri writes it in quotes: "C:\Program Files\AuroraVPN"
          $old = "$((Get-ItemProperty $tauriKey -ErrorAction SilentlyContinue).InstallLocation)".Trim('"')
          if (-not $old) { $old = Join-Path $env:ProgramFiles 'AuroraVPN' }
          Write-Host "Tauri app: exit code $($p.ExitCode), in $old; service: $(Service-Path)"
          if (-not (Test-Path "$old\engine\fswin.exe")) { throw 'the Tauri app did not install' }

          # the user's files, as the Tauri app keeps them
          $data = Join-Path $env:APPDATA 'AuroraVPN'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'upgrade-marker.txt') 'kept'

          $new = (Get-ChildItem new -Filter '*-Setup-*.exe' | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $new -ArgumentList '/S' -PassThru -Wait
          $dir = "$((Get-ItemProperty $electronKey -ErrorAction SilentlyContinue).InstallLocation)".Trim('"')
          Write-Host "Electron app: exit code $($p.ExitCode), in $dir; service: $(Service-Path)"
          Get-ChildItem $old -ErrorAction SilentlyContinue | Format-Table -AutoSize Name, Length | Out-String | Write-Host

          Check 'the installer succeeded' ($p.ExitCode -eq 0)
          Check 'the Tauri app''s Apps & Features entry is gone' (-not (Test-Path $tauriKey))
          Check 'the Tauri app''s engine folder is gone' (-not (Test-Path "$old\engine"))
          Check 'the Tauri app''s uninstaller is gone' (-not (Test-Path "$old\uninstall.exe"))
          Check 'the Electron app is installed' ($dir -and (Test-Path "$dir\resources\app.asar") -and (Test-Path "$dir\resources\engine\fswin.exe"))
          Check 'AuroraVPN Service runs the Electron app''s engine' ("$(Service-Path)" -like '*\resources\engine\fswin.exe*')
          Check 'the user''s files are kept' ((Get-Content (Join-Path $data 'upgrade-marker.txt') -ErrorAction SilentlyContinue) -eq 'kept')

          # and it uninstalls cleanly
          $un = if ($dir) { Get-ChildItem $dir -Filter 'Uninstall *.exe' | Select-Object -First 1 }
          if ($un) { $p = Start-Process -FilePath $un.FullName -ArgumentList '/S', '/allusers', "_?=$dir" -PassThru -Wait }
          Check 'the Electron app uninstalls' ($un -and $p.ExitCode -eq 0)
          Check 'AuroraVPN Service is removed with it' (-not (Get-Service AuroraVPN -ErrorAction SilentlyContinue))
          if ($fail.Count) { throw "$($fail.Count) check(s) failed" }

  # Publishes the build as the latest GitHub release: on every merge to main,
  # and for a pushed vX.Y.Z tag. The app's update check reads it.
  release:
    name: GitHub release
    if: needs.version.outputs.tag != ''
    needs: [version, app, upgrade]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write # start release-aar.yml for this release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # keep it with the repository
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: auroravpn-*-windows-x64
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      # anyone can check that a download was built here, from this commit:
      # gh attestation verify AuroraVPN-Setup-<version>.exe -R paulvers-ui2/port1897
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # creates the tag on this commit when it is new (a merge to main)
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "AuroraVPN $TAG"
          --generate-notes
          --latest
      # a release made with the workflow token starts no workflows, so the
      # Android library is built for it here; it lands on this same release
      - name: Attach the Android library
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh workflow run release-aar.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
