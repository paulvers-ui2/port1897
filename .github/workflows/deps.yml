name: Update deps

# Manual: runs `go get` for the given modules plus `go mod tidy`, and uploads
# the resulting go.mod / go.sum as an artifact to commit by hand.
on:
  workflow_dispatch:
    inputs:
      modules:
        description: "space-separated module@version list"
        required: true
        default: "golang.org/x/net@latest golang.org/x/text@latest golang.org/x/crypto@latest"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go get + tidy
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          go get $MODULES
          go mod tidy
          git diff --stat go.mod go.sum
          git diff go.mod
      - name: Build check
        run: |
          go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/...
          GOOS=windows go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gomod
          path: |
            go.mod
            go.sum
