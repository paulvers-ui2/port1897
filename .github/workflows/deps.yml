name: Update deps

# Manual: runs `go get` for the given modules plus `go mod tidy`, and uploads
# the resulting go.mod / go.sum as an artifact to commit by hand.
on:
  workflow_dispatch:
    inputs:
      modules:
        description: "space-separated module@version list"
        required: true
        default: "golang.org/x/net@latest golang.org/x/text@latest golang.org/x/crypto@latest"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
      - name: go get + tidy
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          go get $MODULES
          go mod tidy
          git diff --stat go.mod go.sum
          git diff go.mod
      - name: Build check
        run: |
          go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/...
          GOOS=windows go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gomod
          path: |
            go.mod
            go.sum
