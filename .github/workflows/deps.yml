name: Update deps

# Manual: runs `go get` for the given modules plus `go mod tidy`, and uploads
# the resulting go.mod / go.sum as an artifact to commit by hand.
on:
  workflow_dispatch:
    inputs:
      modules:
        description: "space-separated module@version list"
        required: true
        default: "golang.org/x/net@latest golang.org/x/text@latest golang.org/x/crypto@latest"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go get + tidy
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          go get $MODULES
          go mod tidy
          git diff --stat go.mod go.sum
          git diff go.mod
      - name: Build check
        run: |
          go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/...
          GOOS=windows go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/...
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gomod
          path: |
            go.mod
            go.sum
