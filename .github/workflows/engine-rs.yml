name: engine-rs

on:
  push:
    paths:
      - "engine-rs/**"
      - "tools/sim/**"
      - ".github/workflows/engine-rs.yml"
  pull_request:
    paths:
      - "engine-rs/**"
      - "tools/sim/**"
      - ".github/workflows/engine-rs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (windows/amd64)
    runs-on: windows-latest # admin: the ignored tests change WFP, HKLM and adapters
    defaults:
      run:
        shell: bash
        working-directory: engine-rs
    env:
      RUST_TOOLCHAIN: "1.99.0"
      CARGO_TERM_COLOR: always
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version
      - name: Build
        run: cargo build --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      # Wintun 0.14.1 with the same pinned hash as windows.yml, in a folder
      # of its own; the adapter test loads it by full path.
      - name: Wintun
        working-directory: ${{ runner.temp }}
        run: |
          mkdir wintun-dl && cd wintun-dl
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          mkdir -p ../wintun-amd64
          cp wintun/bin/amd64/wintun.dll ../wintun-amd64/
      # The tests that change the system (registry nudge, NRPT under HKLM,
      # WFP in an aborted transaction and a dynamic kill switch, a Wintun
      # adapter); one at a time, as they share the system.
      - name: System tests (admin)
        env:
          FSWIN_WINTUN_DIR: ${{ runner.temp }}\wintun-amd64
        run: cargo test --locked --lib -- --ignored --test-threads=1

  # Phase 1's exit test: the Go engine's own end-to-end scripts, unchanged,
  # against fswin-rs.exe copied in as dist/fswin.exe (as sim.yml runs them
  # against fswin.exe). The same scripts passing for both engines is the
  # parity test.
  e2e:
    name: End to end with fswin-rs as fswin.exe (Windows)
    runs-on: windows-latest # admin: Wintun, NRPT, WFP, the service
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: "1.99.0"
      CARGO_TERM_COLOR: always
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # fakedns, and the scripts' live ifbind check
      - name: Build fswin-rs, fakedns and fetch Wintun
        shell: bash
        env:
          CGO_ENABLED: "0"
          CARGO_PROFILE_RELEASE_LTO: "false" # faster CI builds; the code is the same
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          mkdir -p dist
          (cd engine-rs && FSWIN_VERSION="rs-${GITHUB_SHA:0:8}" cargo +"$RUST_TOOLCHAIN" build --locked --release --bin fswin-rs)
          cp engine-rs/target/release/fswin-rs.exe dist/fswin.exe
          go build -trimpath -o dist/fakedns.exe ./tools/sim/fakedns
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll dist/
      - name: Simulate
        shell: pwsh
        run: ./tools/sim/e2e-windows.ps1 -Dist dist -Out sim-out
      - name: AuroraVPN Service
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/sim/service-windows.ps1 -Dist dist -Out sim-out
      # the engine's own logs, in the job log too (the artifact is a zip)
      - name: Engine logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem sim-out -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.Name)"
            Get-Content $_.FullName -TotalCount 80 | Write-Host
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sim-windows-fswin-rs
          path: sim-out/
          if-no-files-found: ignore
