name: Cryptography BoM

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

jobs:

  # github.com/advanced-security/cbom-action
  build-matrix:
    name: 🚏 Repo analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      repositories: ${{ steps.rm.outputs.repositories }}
    steps:
      - name: 🚀 Build analysis matrix
        uses: advanced-security/cbom-action/build-matrix@d8e886f7cbd114c8306a1f9b5dc01a6f5ea45b83 # v1.0.1
        id: rm
        with:
          repositoryNameWithOwner: ${{ github.repository }}
          analyzeDependencies: true
          minimumLanguageBytes: 0

  run-cbom-action:
    name: 📜 ${{ fromJson(matrix.repository).nameWithOwner }} - ${{ fromJson(matrix.repository).language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build-matrix
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.build-matrix.outputs.repositories) }}

    steps:
      - name: 💈 CBOM run
        uses: advanced-security/cbom-action/analyze@e73233dcd4f1aa6932d2ca481a37055ca986f28d # 11 Dec 25
        with:
          repositoryNameWithOwner: ${{ fromJson(matrix.repository).nameWithOwner }}
          language: ${{ fromJson(matrix.repository).language }}
          createCodeQLDatabaseIfRequired: true
          uploadToCodeScanning: false
          requestGitHubAnalysis: false
          queryTimeout: 500

  cbom-summary:
    name: 🌋 CBOM results
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: run-cbom-action
    steps:
      - name: 🔅 Summarize
        uses: advanced-security/cbom-action/workflow-summary@e73233dcd4f1aa6932d2ca481a37055ca986f28d # 11 Dec 25
