name: Simulate

# Replays the failures users hit, on real machines: fswin on a Windows
# runner (admin, Wintun, NRPT, Windows Firewall), and firestack's DoH
# client against blackholed, refusing and misbehaving servers on Linux.
# Results are in each job's summary and the sim-* artifacts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: fswin end to end (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
      - name: Build fswin, fakedns and fetch Wintun
        shell: bash
        env:
          CGO_ENABLED: "0"
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-checklinkname=0 -X main.version=${GITHUB_SHA:0:8}" -o dist/fswin.exe ./cmd/fswin
          go build -trimpath -o dist/fakedns.exe ./tools/sim/fakedns
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll dist/
      - name: Unit tests
        shell: bash
        run: go test -count=1 -ldflags=-checklinkname=0 ./cmd/fswin/ ./win/... 2>&1 | tee unit-tests.txt
      # the same tests under Go's race detector: a data race is how Go code
      # corrupts memory without unsafe (it needs cgo; the runner has gcc)
      - name: Unit tests with the race detector
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -ldflags=-checklinkname=0 ./cmd/fswin/ ./win/... 2>&1 | tee race-tests.txt
      # random input for what the engine parses (fuzz_windows_test.go); a
      # crash fails the job, and its input is in the artifact (testdata/fuzz)
      - name: Fuzz
        shell: bash
        run: |
          for f in FuzzRules FuzzCountry; do
            go test -run='^$' -fuzz="^$f\$" -fuzztime=60s -ldflags=-checklinkname=0 ./cmd/fswin/ 2>&1 | tail -n 15 | tee -a fuzz.txt
          done
      - name: Simulate
        shell: pwsh
        run: ./tools/sim/e2e-windows.ps1 -Dist dist -Out sim-out
      # install AuroraVPN Service, start and stop an engine through it, check
      # what it refuses, uninstall (runs even when the simulation failed)
      - name: AuroraVPN Service
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/sim/service-windows.ps1 -Dist dist -Out sim-out
      # 1 GB down, 100 MB up, a 2.5-minute connection and 64 at once, all
      # through the tunnel (tools/sim/tunnel-soak.ps1)
      - name: Long and heavy traffic through the tunnel
        if: ${{ !cancelled() }}
        shell: pwsh
        timeout-minutes: 20
        run: ./tools/sim/tunnel-soak.ps1 -Dist dist -Out sim-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-windows
          path: |
            sim-out/
            unit-tests.txt
            race-tests.txt
            fuzz.txt
            cmd/fswin/testdata/fuzz/
          if-no-files-found: ignore

  debug-zip:
    name: Debug zip (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Simulate
        # the app's real debug:zip handler, Electron stubbed, secrets planted
        run: node tools/sim/debugzip.js

  dns-linux:
    name: DoH failures (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
      - name: Simulate
        env:
          GOFLAGS: -tags=dnssim -ldflags=-checklinkname=0
          SIM_ONLINE: "1"
        run: |
          cp tools/sim/dnssim/dnssim_*test.go intra/
          go vet ./intra
          # root for the iptables run that drops Cloudflare's tcp/443, as on the user's PC
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GOFLAGS=$GOFLAGS" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            bash tools/sim/dnssim/run-dnssim.sh 2>&1 | tee dnssim.txt
          {
            echo '## DoH failure simulation (Linux)'
            echo
            echo '```'
            grep -E '^#{16}|status|Msg|dnsFailure|DNS log|latency|FAIL|panic' dnssim.txt | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ! grep -qE '^(--- FAIL|FAIL|panic:)' dnssim.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-dns-linux
          path: dnssim.txt
          if-no-files-found: ignore
