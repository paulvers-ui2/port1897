name: Release AAR

# Builds firestack's Android library (AAR) and attaches it to a release in
# this repository, next to the Windows app. Nothing is pushed anywhere else.
# app.yml starts this for every release it publishes (a release made with
# the workflow token starts no workflows by itself); a release published by
# hand starts it through the release event.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach the AAR to, e.g. v0.2.1 (empty: build only)"
        required: false
        type: string

env:
  NDK_VERSION: "28.2.13676358"
  PLATFORM_VERSION: "android-36"
  GOTOOLCHAIN: local

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the AAR to the release
    steps:
      - name: Checkout firestack
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
          cache: false # release build

      - name: Set up JDK (for Android/gomobile toolchain)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "platforms;${{ env.PLATFORM_VERSION }}" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build AAR
        run: |
          make clean
          make intra

      - name: Verify build output
        run: |
          ls -la build/intra/
          test -f build/intra/tun2socks.aar

      - name: Upload build artifact (CI record)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: firestack-aar
          path: |
            build/intra/tun2socks.aar
            build/intra/tun2socks-sources.jar
          if-no-files-found: error

      - name: Attach AAR to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p release
          cp build/intra/tun2socks.aar "release/firestack-android-$TAG.aar"
          if [ -f build/intra/tun2socks-sources.jar ]; then
            cp build/intra/tun2socks-sources.jar "release/firestack-android-$TAG-sources.jar"
          fi
          (cd release && sha256sum ./* | sed 's# \./# #' > "firestack-android-$TAG-SHA256SUMS.txt" && cat ./*SHA256SUMS.txt)
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
