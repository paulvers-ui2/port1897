name: Build and Deploy AAR

on:
  release:
    types: [published]
  # Optional: allow manual runs for testing
  workflow_dispatch:

env:
  NDK_VERSION: "28.2.13676358"
  PLATFORM_VERSION: "android-36"
  GOTOOLCHAIN: local

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firestack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Set up JDK (for Android/gomobile toolchain)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "platforms;${{ env.PLATFORM_VERSION }}" "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build AAR
        run: |
          make clean
          make intra

      - name: Verify build output
        run: |
          ls -la build/intra/
          test -f build/intra/tun2socks.aar

      - name: Upload build artifact (CI record)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestack-aar
          path: |
            build/intra/tun2socks.aar
            build/intra/tun2socks-sources.jar
          if-no-files-found: error

      # --- 1. Attach AAR to the GitHub Release ---
      - name: Attach AAR to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            build/intra/tun2socks.aar
            build/intra/tun2socks-sources.jar

      # --- 2. Push AAR into paulvers-ui/rethink-app:app/firestack ---
      - name: Checkout rethink-app
        if: github.event_name == 'release'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: paulvers-ui/rethink-app
          token: ${{ secrets.RETHINK_APP_PUSH_TOKEN }}
          path: rethink-app

      - name: Copy AAR into rethink-app
        if: github.event_name == 'release'
        run: |
          mkdir -p rethink-app/app/firestack
          cp build/intra/tun2socks.aar rethink-app/app/firestack/
          cp build/intra/tun2socks-sources.jar rethink-app/app/firestack/ || true

      - name: Commit and push to rethink-app
        if: github.event_name == 'release'
        working-directory: rethink-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/firestack/tun2socks.aar app/firestack/tun2socks-sources.jar
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update firestack AAR to ${{ github.event.release.tag_name }}"
            git push origin HEAD
          fi
