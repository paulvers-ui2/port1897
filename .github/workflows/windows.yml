name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (windows/${{ matrix.goarch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        # -checklinkname=0: core/overreach.go links to runtime internals,
        # as in the upstream Makefile.
        run: go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/...
      - name: Vet
        if: matrix.goarch == 'amd64'
        shell: bash
        run: go vet ./intra/... ./tunnel/...
