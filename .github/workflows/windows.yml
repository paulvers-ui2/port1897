name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (windows/${{ matrix.goarch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        # -checklinkname=0: core/overreach.go links to runtime internals,
        # as in the upstream Makefile.
        run: go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/... ./win/...
      - name: Build fswin.exe
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-checklinkname=0 -s -w -X main.version=${GITHUB_SHA:0:8}" -o dist/fswin.exe ./cmd/fswin
          curl -sSfL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "$WINTUN_SHA256  wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/${{ matrix.goarch }}/wintun.dll dist/
          cp wintun/LICENSE.txt dist/wintun-LICENSE.txt
          cp LICENSE dist/LICENSE.txt
      - name: usque (WARP over MASQUE)
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          USQUE_REPO: https://github.com/paulvers-ui/usque.git
          USQUE_REF: b6c79c7d3058e484d845f461447c91daa03df24e
        run: |
          git init -q usque-src
          git -C usque-src fetch -q --depth 1 "$USQUE_REPO" "$USQUE_REF"
          git -C usque-src checkout -q FETCH_HEAD
          (cd usque-src && go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/usque.exe" .)
          cp usque-src/LICENSE.md dist/usque-LICENSE.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fswin-windows-${{ matrix.goarch }}
          path: dist/
      - name: Vet
        if: matrix.goarch == 'amd64'
        shell: bash
        run: go vet ./intra/... ./tunnel/... ./cmd/... ./win/...

  # The Windows split must not break the Android build.
  linux:
    name: Build (linux, android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod # its toolchain line: the patched Go every build uses
      - name: Build (linux/amd64)
        run: go build -ldflags=-checklinkname=0 ./intra/... ./tunnel/... ./cmd/... ./win/...
      - name: Type-check (android/arm64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go vet ./intra/... ./tunnel/...
