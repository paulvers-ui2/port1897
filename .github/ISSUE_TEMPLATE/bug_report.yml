name: Bug report
description: Something is broken or behaves wrongly.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: fswin version
      description: Output of `fswin.exe -version`
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and processor
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: ".\fswin.exe -full -nrpt"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output
      description: The fswin output around the problem. Run with `-log 2` for more detail. Remove anything private (your IP addresses, sites you visited).
      render: text
  - type: input
    id: others
    attributes:
      label: Other VPNs, firewalls or antivirus installed
