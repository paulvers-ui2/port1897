<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://icons.duckduckgo.com">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>port1897</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <main id="pages">

    <!-- Home: same layout as the Android app's tablet home screen -->
    <section class="page" id="page-home" data-page="home">
      <header class="brand">
        <h1 class="brand-title">port1897</h1>
        <span class="brand-heart" data-icon="heart"></span>
      </header>

      <div class="cards-wrap">
        <div class="cards">
          <button class="card" id="card-dns" data-go="dns">
            <h2 class="card-title"><span class="ico" data-icon="dns"></span>DNS</h2>
            <p class="card-main" id="dns-main">Enable DNS mode.</p>
            <p class="card-sub" id="dns-sub"></p>
            <p class="card-foot" id="dns-foot"></p>
          </button>
          <button class="card" id="card-firewall" data-go="firewall">
            <h2 class="card-title"><span class="ico" data-icon="firewall"></span>Firewall</h2>
            <p class="card-main" id="fw-main">Enable firewall mode.</p>
            <p class="card-sub" id="fw-sub"></p>
            <p class="card-foot" id="fw-foot">Disabled</p>
          </button>
          <button class="card" id="card-proxy" data-go="proxy">
            <h2 class="card-title"><span class="ico" data-icon="proxy"></span>Proxy</h2>
            <p class="card-main" id="px-main">Inactive</p>
            <p class="card-sub" id="px-sub"></p>
            <p class="card-foot" id="px-foot">Disabled</p>
          </button>
          <button class="card" id="card-logs" data-go="logs">
            <h2 class="card-title"><span class="ico" data-icon="logs"></span>Logs</h2>
            <p class="card-main" id="logs-main">Enable firewall mode.</p>
            <p class="card-main" id="logs-sub">Disabled</p>
            <p class="card-foot" id="logs-foot"></p>
          </button>
        </div>
        <span class="cards-plus" data-icon="plus"></span>
      </div>

      <button class="card card-wide" id="card-apps" data-go="apps">
        <h2 class="card-title"><span class="ico" data-icon="apps"></span>Apps</h2>
        <div class="apps-row">
          <span class="apps-big" id="apps-seen">0</span>
          <span class="apps-mid">&nbsp;apps seen</span>
          <div class="apps-grid">
            <div><small>Blocked</small><b id="apps-blocked">0</b></div>
            <div><small>Connections</small><b id="apps-flows">0</b></div>
            <div><small>Blocked conns</small><b id="apps-blocked-flows">0</b></div>
            <div><small>Traffic</small><b id="apps-traffic">0 B</b></div>
          </div>
        </div>
      </button>

      <div class="start-area">
        <div class="start-btn" id="start-btn">
          <button class="start-side" id="pause-btn" type="button" title="Pause" aria-label="Pause protection"><span class="start-ico" data-icon="pause"></span></button>
          <button class="start-main" id="start-main" type="button"><span id="start-label">START</span></button>
          <button class="start-side" id="mode-btn" type="button" title="Choose mode" aria-label="Choose mode"><span class="start-ico" data-icon="arrowDown"></span></button>
        </div>
        <p class="protection" id="protection">Not protected</p>
        <p class="start-error" id="start-error" hidden></p>
      </div>
    </section>

    <!-- Every other screen is drawn by pages.js into this section. -->
    <section class="page" id="page-view" data-page="view" hidden></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-nav="home"><span data-icon="navHome"></span>Home</button>
    <button class="nav-item" data-nav="stats"><span data-icon="navStats"></span>Stats</button>
    <button class="nav-item" data-nav="configure"><span data-icon="navConfigure"></span>Configure</button>
    <button class="nav-item" data-nav="about"><span data-icon="navAbout"></span>About</button>
  </nav>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="pages.js"></script>
  <script src="firewall.js"></script>
  <script src="app.js"></script>
</body>
</html>
